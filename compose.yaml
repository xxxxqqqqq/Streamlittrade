name: streamlittrade

services:
  web:
    image: "${IMAGE_NAME:-streamlittrade}:${IMAGE_TAG:-latest}"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-8501}:8501"
    environment:
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DATA_DIR: /app/data
    volumes:
      - app-data:/app/data
    security_opt:
      - no-new-privileges:true

volumes:
  app-data:
