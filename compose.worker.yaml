name: quantforge-compute

services:
  compute-worker:
    image: "${WORKER_IMAGE:-quantforge-worker}:${WORKER_IMAGE_TAG:-hybrid-local}"
    build:
      context: .
      dockerfile: worker/Dockerfile
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}"
    env_file:
      - "${WORKER_ENV_FILE:-.env.worker}"
    restart: unless-stopped
    init: true
    mem_limit: "${WORKER_MEMORY_LIMIT:-16g}"
    cpus: "${WORKER_CPU_LIMIT:-8}"
    environment:
      OMP_NUM_THREADS: "${WORKER_CPU_LIMIT:-8}"
      OPENBLAS_NUM_THREADS: "${WORKER_CPU_LIMIT:-8}"
      MKL_NUM_THREADS: "${WORKER_CPU_LIMIT:-8}"
    volumes:
      - "${WORKER_DATA_HOST_PATH:-./.worker-data}:/var/lib/quantforge-worker"
    security_opt:
      - no-new-privileges:true
