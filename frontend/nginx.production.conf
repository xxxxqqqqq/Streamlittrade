resolver 127.0.0.11 valid=10s ipv6=off;

upstream quantforge_api {
  zone quantforge_api 64k;
  server api:8000 resolve;
}

server {
  listen 80;
  server_name 8.134.107.95;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name 8.134.107.95;
  root /usr/share/nginx/html;
  index index.html;

  ssl_certificate /etc/letsencrypt/live/8.134.107.95/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/8.134.107.95/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  location /api/ {
    proxy_pass http://quantforge_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location /health/ {
    proxy_pass http://quantforge_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
